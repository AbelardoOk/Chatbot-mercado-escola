# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - preencha todos os campos marcados com TODO.
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "Macacolândia"
  integrantes:
    - nome: "Abelardo Palácios Ribeiro"
      rga: "202519060651"
    - nome: "Giovana Gomes Pavese"
      rga: "202519060775"
    - nome: "João Gabriel Casagrande Montanari Teixeira Salomão"
      rga: "202519060708"
    - nome: "Miguel Ribeiro Bernal"
      rga: "202519060163"

tema:
  nome: "Chatbot de dúvidas sobre o mercado escola"
  descricao: >
    Chatbot responde dúvidas para pessoas que tenham interesse sobre o funcionamento, localização, como participar e os feirantes ativos.

dados: # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos: # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna" # ou o modelo indicado pelo professor
  temperatura: 0.3 # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat] # nós em que o LLM redige a resposta
  persona: >
    Você é o Seu Tião, assistente virtual do Mercado Escola da UFMS. Seja cordial, simples, direto e carismático.
  contato: "https://mercadoescola.ufms.br/"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.65

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  horario:
    descricao: "horário de funcionamento"
    resposta: >
      A feira acontece todas as quintas-feiras,
      das 10h30 às 18h30.

  localizacao:
    descricao: "localização da feira"
    resposta: >
      A feira fica na Cidade Universitária da UFMS,
      ao lado do Estádio Moreninho.

  produtos:
    descricao: "produtos disponíveis"
    resposta: >
      Você encontra diversos produtos da agricultura
      familiar, artesanato e da economia criativa.

  produtores:
    descricao: "produtores participantes"
    resposta: >
      A feira reúne produtores locais que comercializam
      produtos da agricultura familiar e economia criativa.

  pagamento:
    descricao: "formas de pagamento"
    resposta: >
      Consulte os produtores para verificar as formas
      de pagamento aceitas em cada barraca.

  objetivo:
    descricao: "objetivo da feira"
    resposta: >
      A feira busca valorizar a agricultura familiar,
      incentivar a economia criativa e aproximar produtores
      e consumidores.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Ôpa! Seja muito bem-vindo, meu filho! No que posso ajudar ocê hoje?"

    agradecimento: "Que isso, meu filho! Tamo aqui pra ajudar, precisando, é só chamar!"

    despedida: "Foi um prazer prosear com ocê! Até mais, meu filho. E apareça sempre!"

    padrao: "Uai, meu filho, sou o Seu Tião! Posso te ajudar com algumas informações sobre: {assuntos}. É só perguntar!"

  fora_dominio: "Ô meu filho, dessa prosa eu não entendo muito não! Mas posso te ajudar com informações sobre: {assuntos}."

  esclarecer: "Pera aí, meu filho, só pra eu não te passar informação errada: ocê quer saber sobre {opcao1} ou sobre {opcao2}?"
